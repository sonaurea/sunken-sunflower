# ─── Sunken Sunflower — Continuous Integration ──────────────────────
name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install system deps (Ebitengine X11)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev libpulse-dev

      - name: Go vet (static analysis)
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Check formatting
        run: |
          gofmt=$(gofmt -l .)
          if [ -n "$gofmt" ]; then
            echo "Unformatted files:"
            echo "$gofmt"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install system deps (Ebitengine X11)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev libpulse-dev

      - name: Run all tests (exclude main package, needs display)
        run: go test ./internal/... -v -count=1 -timeout=60s
        env:
          DISPLAY: ":99"

      - name: Test with race detector
        run: go test ./internal/... -race -count=1 -timeout=90s

      - name: Generate coverage report
        run: go test ./internal/... -coverprofile=coverage.out -covermode=atomic -count=1

      - name: Check coverage threshold (≥70%)
        run: |
          go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | sed 's/%//' | \
          awk '{if ($1 < 70) {print "Coverage " $1 "% < 70% — FAIL"; exit 1}}'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [quality, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: windows
            arch: amd64
            ext: .exe
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build -ldflags="-s -w" -o "sunken-sunflower-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: sunken-sunflower-${{ matrix.os }}-${{ matrix.arch }}*