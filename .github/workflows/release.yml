# ─── Sunken Sunflower — GitHub Actions CI/CD Pipeline ───────────────
# Builds, tests, and packages releases for Steam upload.
name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags
  workflow_dispatch:  # Manual trigger

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go test ./... -v -count=1
      - run: go vet ./...

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
            pkg: tar.gz
          - os: windows
            arch: amd64
            ext: .exe
            pkg: zip
          - os: darwin
            arch: amd64
            ext: ""
            pkg: tar.gz
          - os: darwin
            arch: arm64
            ext: ""
            pkg: tar.gz

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install system deps (Ebitengine X11)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev libpulse-dev

      - name: Build binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/sunken-sunflower-${{ matrix.os }}-${{ matrix.arch }}/sunken-sunflower${{ matrix.ext }}" .

      - name: Package assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="sunken-sunflower-${{ matrix.os }}-${{ matrix.arch }}"
          cp README.md "dist/${DIR}/"
          cp -r mods "dist/${DIR}/"
          echo "v${VERSION}" > "dist/${DIR}/version.txt"
          cd dist
          if [ "${{ matrix.pkg }}" = "zip" ]; then
            zip -r "${DIR}-v${VERSION}.zip" "${DIR}"
          else
            tar czf "${DIR}-v${VERSION}.tar.gz" "${DIR}"
          fi
          cd ..

      - name: Generate checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum *.{tar.gz,zip} > "checksums-v${VERSION}.sha256"
          cd ..

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v3
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}