# ─── golangci-lint Configuration ─────────────────────────────────────
# Run with: golangci-lint run ./...
# v2 config format (required by golangci-lint v2+)
version: "2"

linters:
  default: none
  enable:
    - gofmt        # Ensures code is gofmt-ed
    - govet        # Reports suspicious constructs
    - staticcheck  # Thorough static analysis
    - errcheck     # Checks unchecked errors
    - gosimple     # Suggests simplifications
    - ineffassign  # Detects unused assignments
    - unused       # Detects unused code
    - misspell     # Catches common misspellings
    - revive       # Extensible linter (replaces golint)
  settings:
    gofmt:
      simplify: true
    revive:
      rules:
        - name: exported
          severity: warning
    misspell:
      ignore-words:
        - Crystalisk  # fictional creature name, not a misspelling

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck  # Tests can be more lenient with error checks

run:
  timeout: 5m
  tests: true